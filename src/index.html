<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Closure | Control de Comisiones</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
  <meta name="theme-color" content="#4338ca" id="theme-color-meta">
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      try {
        var modo = localStorage.getItem('theme') || 'system';
        var oscuro = modo === 'dark' ||
          (modo === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.classList.toggle('dark', oscuro);
        root.dataset.theme = oscuro ? 'dark' : 'light';
        var meta = document.getElementById('theme-color-meta');
        if (meta) {
          meta.setAttribute('content', oscuro ? '#0b1220' : '#4338ca');
        }
      } catch (e) {}
    })();
  </script>
  <meta name="description" content="Closure: sistema de control de comisiones para vendedores de lotes">
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Closure" />
  <link rel="preconnect" href="https://res.cloudinary.com" />
  <link rel="dns-prefetch" href="https://res.cloudinary.com" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>

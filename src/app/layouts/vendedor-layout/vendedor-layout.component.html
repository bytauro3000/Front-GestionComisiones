<div class="vendedor-shell">
  <!-- Topbar móvil (solo pantallas pequeñas) -->
  <header class="mobile-topbar">
    <button
      class="menu-toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuAbierto"
      aria-label="Abrir menú de navegación">
      <i class="fas" [ngClass]="menuAbierto ? 'fa-times' : 'fa-bars'"></i>
    </button>
    <a class="topbar-brand" routerLink="/vendedor/inicio" (click)="cerrarMenu()" aria-label="Ir al inicio">
      <div class="brand-mark">
        <img
          src="https://res.cloudinary.com/kqee6exq/image/upload/e_trim,f_auto,q_auto:best,w_192,h_192,c_fit/v1795518731/logoinmo.png"
          alt="Closure"
          width="36"
          height="36"
          decoding="async"
          fetchpriority="high" />
      </div>
      <span class="brand-name">Closure</span>
    </a>
    <app-notificacion-bell />
    <button class="btn-logout btn-logout-top" (click)="logout()" title="Cerrar sesión">
      <i class="fas fa-sign-out-alt"></i>
    </button>
  </header>

  <!-- Hamburguesa fija (solo escritorio): hover abre, click fija -->
  <button
    class="menu-toggle menu-toggle-fixed"
    (click)="toggleMenu()"
    (mouseenter)="entrarHover()"
    (mouseleave)="salirHover()"
    [attr.aria-expanded]="menuAbierto"
    aria-label="Abrir menú de navegación">
    <i class="fas" [ngClass]="menuAbierto ? 'fa-times' : 'fa-bars'"></i>
  </button>

  <!-- Sidebar (oculto por defecto en escritorio) -->
  <aside
    class="sidebar"
    [class.open]="menuAbierto"
    (mouseenter)="entrarHover()"
    (mouseleave)="salirHover()">
    <a class="sidebar-brand" routerLink="/vendedor/inicio" (click)="cerrarMenu()" aria-label="Ir al inicio">
      <span class="brand-mark">
        <img
          src="https://res.cloudinary.com/kqee6exq/image/upload/e_trim,f_auto,q_auto:best,w_192,h_192,c_fit/v1795518731/logoinmo.png"
          alt="Closure"
          width="36"
          height="36"
          decoding="async"
          loading="eager" />
      </span>
      <span class="brand-name">Closure</span>
    </a>
    <nav class="sidebar-nav">
      <a routerLink="/vendedor/inicio" routerLinkActive="active" class="nav-item" (click)="cerrarMenu()">
        <i class="fas fa-home"></i><span>Inicio</span>
      </a>
      <a routerLink="/vendedor/empresas" routerLinkActive="active" class="nav-item" (click)="cerrarMenu()">
        <i class="fas fa-building"></i><span>Empresas</span>
      </a>
      <a routerLink="/vendedor/clientes" routerLinkActive="active" class="nav-item" (click)="cerrarMenu()">
        <i class="fas fa-address-book"></i><span>Clientes</span>
      </a>
      <a routerLink="/vendedor/socios" routerLinkActive="active" class="nav-item" (click)="cerrarMenu()">
        <i class="fas fa-user-friends"></i><span>Socios</span>
      </a>
      <a routerLink="/vendedor/proyectos" routerLinkActive="active" class="nav-item" (click)="cerrarMenu()">
        <i class="fas fa-drafting-compass"></i><span>Proyectos</span>
      </a>
      <a routerLink="/vendedor/lotes" routerLinkActive="active" class="nav-item" (click)="cerrarMenu()">
        <i class="fas fa-map-pin"></i><span>Lotes</span>
      </a>
      <a routerLink="/vendedor/proformas" routerLinkActive="active" class="nav-item" (click)="cerrarMenu()">
        <i class="fas fa-file-signature"></i><span>Proformas</span>
      </a>
      <a routerLink="/vendedor/parametros-comision" routerLinkActive="active" class="nav-item" (click)="cerrarMenu()">
        <i class="fas fa-percent"></i><span>Parámetros</span>
      </a>
      <a routerLink="/vendedor/ventas" routerLinkActive="active" class="nav-item" (click)="cerrarMenu()">
        <i class="fas fa-handshake"></i><span>Ventas</span>
      </a>
      <a routerLink="/vendedor/separaciones" routerLinkActive="active" class="nav-item" (click)="cerrarMenu()">
        <i class="fas fa-hourglass-half"></i><span>Separaciones</span>
      </a>
      <a routerLink="/vendedor/comisiones" routerLinkActive="active" class="nav-item" (click)="cerrarMenu()">
        <i class="fas fa-coins"></i><span>Comisiones</span>
      </a>
      <a routerLink="/vendedor/liquidaciones" routerLinkActive="active" class="nav-item" (click)="cerrarMenu()">
        <i class="fas fa-hand-holding-usd"></i><span>Liquidaciones</span>
      </a>
      <a routerLink="/vendedor/comprobantes" routerLinkActive="active" class="nav-item" (click)="cerrarMenu()">
        <i class="fas fa-file-invoice-dollar"></i><span>Facturación</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="user-avatar">{{ nombreUsuario.charAt(0) }}</div>
        <div class="user-info">
          <strong>{{ nombreUsuario }}</strong>
          <small>Vendedor</small>
        </div>
      </div>
      <app-notificacion-bell />
      <button class="btn-logout" (click)="logout()" title="Cerrar sesión">
        <i class="fas fa-sign-out-alt"></i>
      </button>
    </div>
  </aside>

  <div class="nav-overlay" [class.open]="menuAbierto" (click)="cerrarMenu()" aria-hidden="true"></div>

  <!-- Botón flotante global: solo en Inicio -->
  @if (mostrarFab) {
    <button type="button" class="fab-emitir" (click)="emitirProforma()" title="Emitir nueva proforma">
      <i class="fas fa-file-invoice-dollar"></i><span>Proforma</span>
    </button>
  }

  <!-- Contenido -->
  <main #contenido class="vendedor-content">
    <router-outlet />
  </main>
</div>

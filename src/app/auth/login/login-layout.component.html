<div class="login-split">
  <!-- Panel izquierdo: marca + firma visual -->
  <aside class="branding-panel">
    <div class="branding-top">
      <a class="brand" routerLink="/login" aria-label="Vende Lote">
        <span class="brand-mark"><i class="fas fa-layer-group"></i></span>
        <span class="brand-name">{{ nombreSistema }}</span>
      </a>
    </div>

    <div class="branding-hero">
      <h1>Cada lote vendido.<br><em>Cada comisión clara.</em></h1>
      <p class="lede">Ventas, comisiones y proformas en un solo lugar.</p>
    </div>

    <div class="parcel-map" aria-hidden="true">
      <svg viewBox="0 0 640 520" fill="none">
        <g class="contours" stroke="currentColor" stroke-width="1">
          <path d="M-40 350C90 290 180 420 320 360S520 250 700 320" />
          <path d="M-40 395C100 335 190 465 330 405S530 295 700 365" />
          <path d="M-40 440C110 380 200 510 340 450S540 340 700 410" />
          <path d="M-40 485C120 425 210 555 350 495S550 385 700 455" />
        </g>
        <g class="parcels" stroke="currentColor" stroke-width="1.2">
          <rect x="238" y="250" width="88" height="64" rx="3" />
          <rect x="334" y="250" width="88" height="64" rx="3" />
          <rect x="238" y="322" width="88" height="64" rx="3" />
          <rect x="334" y="322" width="88" height="64" rx="3" />
          <rect x="238" y="394" width="88" height="64" rx="3" />
          <rect x="334" y="394" width="88" height="64" rx="3" />
        </g>
        <rect class="parcel-active" x="430" y="322" width="88" height="64" rx="3" />
      </svg>
    </div>
  </aside>

  <!-- Panel derecho: formulario -->
  <main class="form-panel">
    <div class="form-wrapper">
      <div class="mobile-brand">
        <span class="brand-mark"><i class="fas fa-layer-group"></i></span>
        <span class="brand-name">{{ nombreSistema }}</span>
      </div>

      <div class="auth-card">
        <header class="form-header">
          <h2>{{ titulo }}</h2>
          @if (esRegistro) {
            <p>{{ subtitulo }}</p>
          }
        </header>

        <router-outlet></router-outlet>
      </div>

      <p class="legal">© {{ anioActual }} {{ nombreSistema }}</p>
    </div>
  </main>
</div>
